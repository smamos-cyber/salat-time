name: Chercher des fonds d'écran (outil)

on:
  push:
    branches: ['outils-*']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow
      - run: echo "outil désactivé"
      - name: Publier les aperçus sur la branche apercus-mawaqit
        run: |
          cd apercus
          git init -q -b apercus-mawaqit
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -q -m "Échantillons Mawaqit"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apercus-mawaqit
