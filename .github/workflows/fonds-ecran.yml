name: Captures d'écran (outil)

on:
  push:
    branches: ['outils-*']

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: telephone
            target: google_apis
            arch: x86_64
            profile: pixel_6
          - name: tv
            target: android-tv
            arch: x86
            profile: tv_1080p
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.11.1 }
      - run: |
          pip install --quiet pillow
          python3 tools/make_icons.py app/src/main/res
          mkdir -p app/src/main/res/raw
          curl -fL --retry 3 -A "Mozilla/5.0" -o app/src/main/res/raw/adhan_default.mp3 https://www.islamcan.com/audio/adhan/azan1.mp3
          python3 tools/download_wallpapers.py
          gradle assembleDebug --no-daemon
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/screens.sh captures ${{ matrix.name }}
      - name: Publier les captures
        run: |
          cd captures
          git init -q -b apercus-ecrans-${{ matrix.name }}
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -q -m "Captures ${{ matrix.name }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apercus-ecrans-${{ matrix.name }}
